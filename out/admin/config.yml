site_url: https://gonginssa.kr

backend:
  name: github
  repo: ium-strategy/gonginssa
  branch: main
  base_url: https://gonginssa.kr      # OAuth 처리를 맡는 도메인 (functions/oauth/*)
  auth_endpoint: oauth/auth           # 로그인 팝업이 여는 경로

# GitHub 계정으로 로그인하며, 해당 저장소에 쓰기 권한이 있는 사용자만 접근 가능하다.
# 담당자 추가는 GitHub 저장소 Settings > Collaborators 에서 초대하면 된다.

media_folder: "out/assets/uploads"   # 업로드한 이미지가 저장되는 저장소 경로
public_folder: "/assets/uploads"     # 사이트에서 그 이미지를 가리킬 때 쓰는 공개 URL 경로

publish_mode: simple
locale: "ko"

collections:
  - name: "articles"
    label: "아티클"
    label_singular: "아티클"
    folder: "content/articles"       # 이 폴더의 .md 파일들을 build_articles.py가 읽어 사이트를 만든다
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{category}} · {{date}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "제목", name: "title", widget: "string", required: true }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options: ["실무 꿀팁", "레퍼런스"]
        default: "실무 꿀팁"
      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
      - label: "해시태그"
        name: "hashtags"
        widget: "list"
        required: false
        hint: "예: SNS, 보도자료, 공모전"
      - label: "참고 자료 링크"
        name: "reference"
        widget: "string"
        required: false
      - label: "훅(도입부 요약)"
        name: "hook"
        widget: "text"
        hint: "카드/목록에 노출되는 짧은 요약. 1~2문장 권장."
      - label: "썸네일 이미지"
        name: "thumb"
        widget: "image"
        required: false
        media_library:
          config:
            max_file_size: 5000000
        hint: "비워두면 제목·카테고리로 브랜드 썸네일이 자동 생성됩니다(그라데이션 배경 + 제목 + 아이콘). 직접 올리려면 권장 비율 16:9 (예: 1200×675)."
      - label: "자동 썸네일 아이콘"
        name: "icon"
        widget: "select"
        required: false
        hint: "썸네일 이미지를 비워둔 경우에만 사용됩니다. 비워두면 제목·해시태그로 자동 판별합니다."
        options:
          - { label: "자동 판별(기본)", value: "" }
          - { label: "AI·챗봇", value: "ai" }
          - { label: "확성기·홍보", value: "megaphone" }
          - { label: "카메라·사진", value: "camera" }
          - { label: "사람·팔로워", value: "people" }
          - { label: "달력·일정", value: "calendar" }
          - { label: "영상", value: "video" }
          - { label: "그래프·트렌드", value: "chart" }
          - { label: "트로피·공모전", value: "trophy" }
          - { label: "문서(기본형)", value: "doc" }
      - label: "본문"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - code
        editor_components:
          - image
        hint: >-
          이미지는 툴바의 이미지 버튼으로 바로 삽입하면 됩니다. 유튜브 영상은 링크(예:
          https://www.youtube.com/watch?v=xxxxxxxxxxx)만 단독으로 한 줄에 붙여넣으면 자동으로 재생 화면이 삽입됩니다.
          "Rich Text" ↔ "Markdown" 전환 버튼(우측 상단)으로 원문 마크다운도 직접 편집할 수 있습니다.
