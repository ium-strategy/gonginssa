<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구독자 관리 — 공인싸</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUITE@2/fonts/static/woff2/SUITE.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{--purple:#6C4DFF;--bg:#0D0D14;--text:#1B1B24;--text-muted:#6B6B7A;--line:#E7E7EF;--radius:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','SUITE',sans-serif;background:#F7F7FB;color:var(--text);min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  .top h1{font-size:22px;margin:0}
  .top a{color:var(--text-muted);font-size:14px;text-decoration:none}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px}
  .gate p{color:var(--text-muted);font-size:14px;margin:0 0 4px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;border:0;background:var(--purple);color:#fff;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
  .btn:hover{opacity:.92}
  .btn-line{background:#fff;color:var(--text);border:1px solid var(--line)}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .toolbar .meta{font-size:13px;color:var(--text-muted)}
  .actions{display:flex;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  td.email{font-weight:600}
  .table-wrap{overflow-x:auto}
  .empty{padding:40px 0;text-align:center;color:var(--text-muted);font-size:14px}
  .err{padding:16px;background:#FFF3F3;color:#C6403C;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
  .loading{padding:40px 0;text-align:center;color:var(--text-muted);font-size:14px;display:none}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>구독자 관리</h1>
    <a href="index.html">← 홈으로</a>
  </div>

  <div id="gate" class="gate card">
    <p>Netlify Identity로 로그인하면<br>뉴스레터 구독 신청 목록을 볼 수 있습니다.</p>
    <button class="btn" id="loginBtn">로그인</button>
  </div>

  <div id="panel" class="card" style="display:none">
    <div class="err" id="err"></div>
    <div class="toolbar">
      <div class="meta" id="meta">불러오는 중…</div>
      <div class="actions">
        <button class="btn btn-line" id="refreshBtn">새로고침</button>
        <button class="btn btn-line" id="csvBtn">CSV 다운로드</button>
        <button class="btn btn-line" id="logoutBtn">로그아웃</button>
      </div>
    </div>
    <div class="loading" id="loading">불러오는 중…</div>
    <div class="table-wrap">
      <table id="tbl" style="display:none">
        <thead>
          <tr><th>이메일</th><th>이름</th><th>구독 경로</th><th>신청일시</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">아직 구독 신청이 없습니다.</div>
  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
(function(){
  var gate = document.getElementById('gate');
  var panel = document.getElementById('panel');
  var loginBtn = document.getElementById('loginBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var csvBtn = document.getElementById('csvBtn');
  var tbl = document.getElementById('tbl');
  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('empty');
  var loading = document.getElementById('loading');
  var meta = document.getElementById('meta');
  var errBox = document.getElementById('err');
  var lastRows = [];

  function showErr(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }
  function clearErr(){ errBox.style.display = 'none'; errBox.textContent = ''; }

  function fmtDate(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    }catch(e){ return iso || ''; }
  }

  function render(rows){
    lastRows = rows;
    tbody.innerHTML = '';
    if (!rows.length){
      tbl.style.display = 'none';
      empty.style.display = 'block';
      meta.textContent = '총 0명';
      return;
    }
    empty.style.display = 'none';
    tbl.style.display = 'table';
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="email"></td><td></td><td></td><td></td>';
      tr.children[0].textContent = r.email || '';
      tr.children[1].textContent = r.name || '';
      tr.children[2].textContent = r.referral || '';
      tr.children[3].textContent = fmtDate(r.submitted_at);
      tbody.appendChild(tr);
    });
    meta.textContent = '총 ' + rows.length + '명';
  }

  function load(){
    clearErr();
    loading.style.display = 'block';
    tbl.style.display = 'none';
    empty.style.display = 'none';
    var user = window.netlifyIdentity.currentUser();
    if (!user){ return; }
    user.jwt().then(function(token){
      return fetch('/.netlify/functions/subscribers', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data.error || ('오류 (' + res.status + ')'));
        return data;
      });
    }).then(function(data){
      loading.style.display = 'none';
      render(data.subscribers || []);
    }).catch(function(e){
      loading.style.display = 'none';
      showErr('구독자 목록을 불러오지 못했습니다: ' + e.message);
    });
  }

  function toCSV(rows){
    var head = ['email','name','referral','submitted_at'];
    var lines = [head.join(',')];
    rows.forEach(function(r){
      lines.push(head.map(function(k){
        var v = (r[k] || '').toString().replace(/"/g,'""');
        return '"' + v + '"';
      }).join(','));
    });
    return lines.join('\n');
  }

  csvBtn.addEventListener('click', function(){
    if (!lastRows.length){ return; }
    var csv = '﻿' + toCSV(lastRows);
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'gonginssa_subscribers_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  refreshBtn.addEventListener('click', load);

  loginBtn.addEventListener('click', function(){ window.netlifyIdentity.open('login'); });
  logoutBtn.addEventListener('click', function(){ window.netlifyIdentity.logout(); });

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', function(user){
      if (user){
        gate.style.display = 'none';
        panel.style.display = 'block';
        load();
      } else {
        gate.style.display = 'flex';
        panel.style.display = 'none';
      }
    });
    window.netlifyIdentity.on('login', function(){
      gate.style.display = 'none';
      panel.style.display = 'block';
      load();
      window.netlifyIdentity.close();
    });
    window.netlifyIdentity.on('logout', function(){
      gate.style.display = 'flex';
      panel.style.display = 'none';
    });
    window.netlifyIdentity.init();
  } else {
    showErr('로그인 위젯을 불러오지 못했습니다. 잠시 후 새로고침 해주세요.');
  }
})();
</script>

</body>
</html>
